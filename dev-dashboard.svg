<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" width="480" height="340">
  <style>
    .type{transform-box:fill-box;transform-origin:left center;animation:type 6s steps(24) infinite}
    .l1{animation-delay:0s}.l2{animation-delay:.4s}.l3{animation-delay:.8s}.l4{animation-delay:1.2s}
    .l5{animation-delay:1.6s}.l6{animation-delay:2s}.l7{animation-delay:2.4s}.l8{animation-delay:2.8s}
    @keyframes type{0%{transform:scaleX(0)}25%,85%{transform:scaleX(1)}100%{transform:scaleX(0)}}
    .cursor{animation:blink 1s step-end infinite}
    @keyframes blink{50%{opacity:0}}
    .bar{transform-origin:bottom;transform-box:fill-box;animation:grow 3s ease-in-out infinite alternate}
    .b2{animation-delay:.3s}.b3{animation-delay:.6s}.b4{animation-delay:.9s}.b5{animation-delay:1.2s}
    @keyframes grow{0%{transform:scaleY(.25)}100%{transform:scaleY(1)}}
    .line{stroke-dasharray:260;stroke-dashoffset:260;animation:draw 4s ease-in-out infinite}
    @keyframes draw{0%{stroke-dashoffset:260}50%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-260}}
    .dot{animation:pulse 2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    .float{animation:float 4s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    .spin{transform-origin:418px 92px;animation:spin 6s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/><stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2b544" stop-opacity=".35"/><stop offset="1" stop-color="#f2b544" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="480" height="340" rx="18" fill="url(#bg)"/>
  <g class="float">
    <rect x="22" y="26" width="236" height="200" rx="10" fill="#1a1b26" stroke="#2f3549"/>
    <circle cx="38" cy="42" r="4.5" fill="#ff5f56"/><circle cx="52" cy="42" r="4.5" fill="#ffbd2e"/><circle cx="66" cy="42" r="4.5" fill="#27c93f"/>
    <text x="90" y="46" font-family="monospace" font-size="10" fill="#565f89">Dashboard.tsx</text>
    <line x1="22" y1="56" x2="258" y2="56" stroke="#2f3549"/>
    <g font-family="monospace" font-size="9" fill="#565f89">
      <text x="32" y="78">1</text><text x="32" y="96">2</text><text x="32" y="114">3</text><text x="32" y="132">4</text>
      <text x="32" y="150">5</text><text x="32" y="168">6</text><text x="32" y="186">7</text><text x="32" y="204">8</text>
    </g>
    <g transform="translate(48,0)">
      <rect class="type l1" x="0" y="71" width="70" height="8" rx="3" fill="#bb9af7"/>
      <rect class="type l2" x="0" y="89" width="150" height="8" rx="3" fill="#7aa2f7"/>
      <rect class="type l3" x="14" y="107" width="110" height="8" rx="3" fill="#9ece6a"/>
      <rect class="type l4" x="14" y="125" width="130" height="8" rx="3" fill="#e0af68"/>
      <rect class="type l5" x="28" y="143" width="90" height="8" rx="3" fill="#7dcfff"/>
      <rect class="type l6" x="28" y="161" width="120" height="8" rx="3" fill="#f7768e"/>
      <rect class="type l7" x="14" y="179" width="60" height="8" rx="3" fill="#9ece6a"/>
      <rect class="type l8" x="0" y="197" width="40" height="8" rx="3" fill="#bb9af7"/>
    </g>
    <rect class="cursor" x="98" y="196" width="2" height="11" fill="#c0caf5"/>
  </g>
  <g>
    <rect x="276" y="26" width="182" height="134" rx="10" fill="#1a1b26" stroke="#2f3549"/>
    <text x="290" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#a9b1d6">Conversion Rate</text>
    <text x="290" y="68" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#ffffff">+28% <tspan class="dot" font-size="11" fill="#9ece6a">▲</tspan></text>
    <circle cx="418" cy="92" r="20" fill="none" stroke="#2f3549" stroke-width="7"/>
    <g class="spin"><circle cx="418" cy="92" r="20" fill="none" stroke="#f2b544" stroke-width="7" stroke-dasharray="80 46" stroke-linecap="round"/></g>
    <g>
      <rect class="bar b1" x="292" y="104" width="12" height="44" rx="2" fill="#7aa2f7"/>
      <rect class="bar b2" x="310" y="92" width="12" height="56" rx="2" fill="#7aa2f7"/>
      <rect class="bar b3" x="328" y="112" width="12" height="36" rx="2" fill="#7aa2f7"/>
      <rect class="bar b4" x="346" y="84" width="12" height="64" rx="2" fill="#f2b544"/>
      <rect class="bar b5" x="364" y="98" width="12" height="50" rx="2" fill="#7aa2f7"/>
    </g>
  </g>
  <g>
    <rect x="276" y="172" width="182" height="142" rx="10" fill="#1a1b26" stroke="#2f3549"/>
    <text x="290" y="194" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#a9b1d6">Organic Traffic</text>
    <text x="290" y="212" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#ffffff">100K+ <tspan font-size="9" fill="#9ece6a">visitors/mo</tspan></text>
    <g stroke="#2f3549" stroke-width="1">
      <line x1="290" y1="240" x2="446" y2="240"/><line x1="290" y1="268" x2="446" y2="268"/><line x1="290" y1="296" x2="446" y2="296"/>
    </g>
    <path d="M290 290 L316 282 L342 286 L368 266 L394 270 L420 246 L446 232 L446 300 L290 300Z" fill="url(#area)" class="dot"/>
    <path class="line" d="M290 290 L316 282 L342 286 L368 266 L394 270 L420 246 L446 232" fill="none" stroke="#f2b544" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle class="dot" cx="446" cy="232" r="4" fill="#f2b544"/>
  </g>
  <g font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="600">
    <g class="float" style="animation-delay:.5s">
      <rect x="22" y="242" width="112" height="32" rx="8" fill="#1a1b26" stroke="#2f3549"/>
      <text x="34" y="262" fill="#7dcfff">⚡ 40% faster</text>
    </g>
    <g class="float" style="animation-delay:1s">
      <rect x="146" y="242" width="112" height="32" rx="8" fill="#1a1b26" stroke="#2f3549"/>
      <text x="158" y="262" fill="#9ece6a">● 99.5% uptime</text>
    </g>
    <g class="float" style="animation-delay:1.5s">
      <rect x="22" y="282" width="236" height="32" rx="8" fill="#1a1b26" stroke="#2f3549"/>
      <text x="34" y="302" fill="#bb9af7">React · Next.js · TypeScript · Power BI</text>
    </g>
  </g>
</svg>
